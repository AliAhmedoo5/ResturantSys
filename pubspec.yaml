name: resturant_sys
description: "A fast-food restaurant POS & kitchen inventory desktop operations system."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  file_selector: ^1.0.3
  desktop_drop: 0.6.1
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.4+4
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.24
  crypto: ^3.0.3
  path: ^1.9.0
  archive: ^3.6.1
  pdf: ^3.11.1
  printing: '>=5.14.3 <5.15.0'
  mailer: ^6.4.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
