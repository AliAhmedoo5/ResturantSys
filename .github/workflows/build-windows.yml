name: Build Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Build Windows x64 Desktop Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform runner
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\resturant-pos-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resturant-pos-windows-x64
          path: dist/resturant-pos-windows-x64.zip
          if-no-files-found: error
