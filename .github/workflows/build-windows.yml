name: Build Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 Desktop Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform runner
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: ./scripts/ci/package-windows.ps1

      - name: Verify extracted package startup
        shell: pwsh
        run: ./scripts/ci/smoke-windows-package.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resturant-pos-windows-x64
          path: dist/*
          if-no-files-found: error
