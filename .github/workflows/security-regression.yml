name: Security regression
on:
  workflow_dispatch:
  push:
    branches: [codex/protect-history-and-pin-security]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter test test/security/urgent_protection_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/auth test/khata test/database/pos_vendor_khata_schema_test.dart test/widgets/vendor_khata_workspace_test.dart test/widgets/pin_lock_screen_test.dart test/procurement
