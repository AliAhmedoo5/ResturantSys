name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQLite native library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev poppler-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        timeout-minutes: 12
        env:
          SYNTHETIC_Z_CLOSE_FIXTURE: ${{ runner.temp }}/synthetic-z-close-fixture
        run: flutter test

      - name: Validate synthetic report example
        if: always()
        shell: bash
        env:
          FIXTURE_DIR: ${{ runner.temp }}/synthetic-z-close-fixture
        run: |
          if [ -f "$FIXTURE_DIR/synthetic-z-close.pdf" ]; then
            pdfinfo "$FIXTURE_DIR/synthetic-z-close.pdf"
            pdftotext -layout "$FIXTURE_DIR/synthetic-z-close.pdf" "$FIXTURE_DIR/synthetic-z-close.txt"
            grep -q 'Synthetic Burger' "$FIXTURE_DIR/synthetic-z-close.txt"
            grep -q 'Synthetic Flour' "$FIXTURE_DIR/synthetic-z-close.txt"
            grep -q 'JAZZCASH' "$FIXTURE_DIR/synthetic-z-close.txt"
            pdftoppm -scale-to 1600 -png "$FIXTURE_DIR/synthetic-z-close.pdf" "$FIXTURE_DIR/synthetic-z-close"
          fi

      # This directory is populated ONLY by the fresh temporary SQLite fixture
      # named 'recovers synthetic report snapshot ...', using literal fake data.
      # Never collect the runtime application's reports or default database path.
      - name: Upload synthetic fixture example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-z-close-example
          path: ${{ runner.temp }}/synthetic-z-close-fixture/
          if-no-files-found: ignore

