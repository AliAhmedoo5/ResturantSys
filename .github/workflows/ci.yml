name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      test_paths:
        description: 'Optional space-separated test paths; blank runs the complete suite'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Fast Gatekeeper (Typecheck & Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (Fail-Fast Gatekeeper)
        run: flutter analyze --no-fatal-infos

  backup-windows:
    name: Backup recovery on Windows
    needs: [analyze]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify database and media recovery
        run: flutter test test/database/database_backup_service_test.dart test/database/database_restore_service_test.dart

      - name: Verify Windows PIN login latency
        run: flutter test test/auth/pin_login_latency_test.dart test/auth/pin_derivation_compatibility_test.dart test/auth/pin_hasher_test.dart test/security/urgent_protection_test.dart --reporter expanded

      - name: Verify release-mode Windows PIN latency
        if: success() || failure()
        shell: pwsh
        run: |
          dart compile exe scripts/ci/benchmark-pin.dart -o "$env:RUNNER_TEMP/pin-benchmark.exe"
          if ($LASTEXITCODE -ne 0) { throw 'PIN benchmark compilation failed.' }
          & "$env:RUNNER_TEMP/pin-benchmark.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Release PIN benchmark failed.' }

  test:
    name: Tests (Shard ${{ matrix.shard }}/4)
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQLite native library & PDF utilities
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev poppler-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Preserve resolved dependency lock
        if: matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: pubspec.lock
          if-no-files-found: error

      - name: Create disposable local SMTP TLS fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smtp-fixture"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -keyout "$RUNNER_TEMP/smtp-fixture/key.pem" -out "$RUNNER_TEMP/smtp-fixture/cert.pem" >/dev/null 2>&1

      - name: Run tests
        timeout-minutes: 12
        shell: bash
        env:
          TEST_PATHS: ${{ inputs.test_paths }}
          SYNTHETIC_Z_CLOSE_FIXTURE: ${{ runner.temp }}/synthetic-z-close-fixture
          SMTP_FIXTURE_DIRECTORY: ${{ runner.temp }}/smtp-fixture
          CAPTURE_DESKTOP: 'true'
        run: |
          if [ -n "$TEST_PATHS" ]; then
            if [ "${{ matrix.shard }}" -ne 0 ]; then
              echo "Targeted test path provided; non-primary shard skipping."
              exit 0
            fi
            read -r -a test_paths <<< "$TEST_PATHS"
            flutter test --timeout 2m "${test_paths[@]}"
          else
            flutter test --timeout 2m --total-shards 4 --shard-index ${{ matrix.shard }}
          fi

      - name: Upload desktop layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-layout-previews-shard-${{ matrix.shard }}
          path: build/desktop-previews/*.png
          if-no-files-found: ignore

      - name: Validate synthetic report example
        if: always()
        shell: bash
        env:
          FIXTURE_DIR: ${{ runner.temp }}/synthetic-z-close-fixture
        run: |
          if [ -f "$FIXTURE_DIR/synthetic-z-close.pdf" ]; then
            pdfinfo "$FIXTURE_DIR/synthetic-z-close.pdf"
            pdftotext -layout "$FIXTURE_DIR/synthetic-z-close.pdf" "$FIXTURE_DIR/synthetic-z-close.txt"
            grep -q 'Synthetic Burger' "$FIXTURE_DIR/synthetic-z-close.txt"
            grep -q 'Synthetic Flour' "$FIXTURE_DIR/synthetic-z-close.txt"
            grep -q 'JAZZCASH' "$FIXTURE_DIR/synthetic-z-close.txt"
            pdftoppm -scale-to 1600 -png "$FIXTURE_DIR/synthetic-z-close.pdf" "$FIXTURE_DIR/synthetic-z-close"
          fi

      - name: Upload synthetic fixture example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-z-close-example-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/synthetic-z-close-fixture/
          if-no-files-found: ignore
